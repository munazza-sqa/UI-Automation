name: QA Automation Regression Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-execution:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Run Automation Tests
      env:
        BASE_URL: ${{ vars.BASE_URL }}
        SLOW_MO: ${{ vars.SLOW_MO }}
        TIMEOUT: ${{ vars.TIMEOUT }}
        LOG_FILE: ${{ vars.LOG_FILE }}
        VIDEO_DIR: ${{ vars.VIDEO_DIR }}
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true 

    # 1. NEW: Fetch your existing history from the gh-pages branch first
    - name: Load Test History From GitHub Pages
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    # 2. FIXED: Swapped to the verified, history-compatible community action
    - name: Generate Allure Report with History
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    # 3. KEEP: Uploads your raw results, video, and logs as a zip backup artifact
    - name: Upload Test Report Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-test-results
        path: |
          allure-results/
          video/
          automation.log
        retention-days: 7
      
    # 4. KEEP: Deploys your consolidated history directory to live GitHub Pages
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-history