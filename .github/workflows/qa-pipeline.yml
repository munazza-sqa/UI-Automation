name: QA Automation Regression Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-execution:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Run Automation Tests
      env:
        BASE_URL: ${{ vars.BASE_URL }}
        SLOW_MO: ${{ vars.SLOW_MO }}
        TIMEOUT: ${{ vars.TIMEOUT }}
        LOG_FILE: ${{ vars.LOG_FILE }}
        VIDEO_DIR: ${{ vars.VIDEO_DIR }}
      run: |
        pytest --alluredir=allure-results
      continue-on-error: true 

    # FIXED: Swapped to the official, non-Docker action with the proper @v2 version tag
    - name: Load Allure History & Generate Report
      uses: allure-framework/report-action@v2
      if: always()
      with:
        allure-results: allure-results
        gh-pages: gh-pages
        allure-report: allure-report
        allure-history: allure-history

    # KEEP: Still uploads your raw results, video, and logs as a zip backup
    - name: Upload Test Report Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-test-results
        path: |
          allure-results/
          video/
          automation.log
        retention-days: 7
      
    # FIXED: Changed publish_dir to 'allure-history' so your historical test trends show up 
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-history