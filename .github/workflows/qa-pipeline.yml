name: QA Automation Regression Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-execution:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # 1. Run tests using the Allure directory flag
    - name: Run Automation Tests
      continue-on-error: true
      env:
        BASE_URL: ${{ vars.BASE_URL }}
        SLOW_MO: ${{ vars.SLOW_MO }}
        TIMEOUT: ${{ vars.TIMEOUT }}
        LOG_FILE: ${{ vars.LOG_FILE }}
        VIDEO_DIR: ${{ vars.VIDEO_DIR }}
      run: |
        mkdir -p allure-results video
        touch automation.log
        pytest --alluredir=allure-results

    # 2. Pull down existing history from gh-pages so trends don't reset
    - name: Load Test History From GitHub Pages
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Ensure History Directory Exists
      if: always()
      run: mkdir -p gh-pages

    # 3. Build the Allure report using the verified marketplace action
    - name: Generate Allure Report with History
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    # 4. Upload raw results and media files as a zip backup
    - name: Upload Test Report Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qa-test-results
        path: |
          allure-results/
          allure-history/
          video/
          automation.log
        if-no-files-found: ignore
        retention-days: 7

    # 5. Point publish_dir directly to the consolidated 'allure-history' folder
    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-history