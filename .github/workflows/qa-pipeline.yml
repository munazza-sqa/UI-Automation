name: QA Automation Regression Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Added permissions required to deploy to GitHub Pages
permissions:
  contents: write

jobs:
  test-execution:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    # Changed the report name to index.html inside a 'public' directory for easy GH Pages hosting
    - name: Run Automation Tests
      run: |
        mkdir -p public
        pytest --html=public/index.html --self-contained-html

    # Updated paths to match the new directory structure
    - name: Upload Test Report Artifacts
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: qa-test-results
        path: |
          public/index.html
          videos/
          automation.log
        retention-days: 7
      
    # Pointed publish_dir directly to the 'public' folder
    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public